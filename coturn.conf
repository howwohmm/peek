# peek — coturn config
# minimal local-dev defaults. lines marked PROD: should be reviewed.
#
# PROD checklist:
#   - set `external-ip` to your VPS public IP (or use --external-ip flag)
#   - set `realm` to your real domain
#   - rotate `static-auth-secret` and match it in livekit.yaml
#   - mount real TLS certs and uncomment cert / pkey lines for TURN-over-TLS
#   - run with `network_mode: host` in docker-compose for proper UDP relay
#   - widen the relay port range to match expected classroom load

listening-port=3478
tls-listening-port=5349

# relay range — must match docker-compose port mapping
min-port=49160
max-port=49200

fingerprint

# use shared-secret auth — livekit signs short-lived TURN credentials with this.
# PROD: rotate this; keep it in sync with livekit.yaml turn shared secret.
use-auth-secret
static-auth-secret=devturnsecretdevturnsecret

realm=peek.local

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# PROD: TLS for TURN-over-TLS (5349)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# PROD: set the VPS public IP so relay candidates advertise correctly
# external-ip=YOUR.PUBLIC.IP.HERE

# logging
log-file=stdout
verbose
